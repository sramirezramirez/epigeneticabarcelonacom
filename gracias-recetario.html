<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Descarga tu recetario | Epigenética BCN</title>
    <link rel="stylesheet" href="/landing/styles.css" id="page-css">
    <link rel="stylesheet" href="landing/styles.css" id="page-css-local" media="all">
    <script>
      (function () {
        if (location.protocol === 'file:') {
          var a = document.getElementById('page-css');
          if (a) a.remove();
        } else {
          var b = document.getElementById('page-css-local');
          if (b) b.remove();
        }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .thanks-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
        .thanks-card { max-width: 520px; width: 100%; text-align: center; }
        .thanks-card p { color: var(--text-muted); margin: 1rem 0 1.75rem; line-height: 1.65; }
    </style>
</head>
<body>
    <div class="thanks-wrap">
        <div class="thanks-card glass-card container">
            <div class="logo" style="margin-bottom: 1.25rem;">Epigenética<span>BCN</span></div>
            <h1 style="font-size: 1.65rem; color: #2d3748;">¡Gracias por tu compra!</h1>
            <p>Tu pago del <strong>Recetario Antiinflamatorio (Reset 21 Días)</strong> se ha completado. Descarga el PDF en tu dispositivo; también puedes volver a esta página cuando quieras si guardas el enlace.</p>
            <a href="/recetario-reset-21-dias.pdf" class="btn-primary glow-effect btn-large w-100 text-center" style="display: inline-block; max-width: 100%;" download>Descargar recetario (PDF)</a>
            <p class="mt-4" style="font-size: 0.9rem;"><a href="/" style="color: var(--accent-primary); font-weight: 600;">Volver a la web</a></p>
        </div>
    </div>
</body>
</html>
